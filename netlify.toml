# Netlify configuration for PDF Merger
# Static site – no build step required.

[build]
  publish = "."

# Redirect all paths to index.html (SPA fallback – not strictly needed
# for a single-page static app but good practice)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    # Allow pdf-lib and Sortable from CDN
    Content-Security-Policy    = "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src blob:; worker-src blob:;"

# Long-cache for versioned static assets
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
